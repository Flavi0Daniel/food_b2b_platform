<div class="max-w-2xl space-y-6">
  <!-- Dados do perfil -->
  <div class="bg-white border rounded-lg p-6">
    <h2 class="text-base font-semibold text-gray-800 mb-1">O meu perfil</h2>
    <p class="text-sm text-gray-500 mb-5">
      {{ auth.currentUser?.email }} · <span class="text-gray-400">{{ auth.currentUser?.role }}</span>
    </p>

    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
        <input formControlName="name" class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
        <input formControlName="phone" class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Empresa</label>
        <input formControlName="companyName" class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">NIF</label>
        <input formControlName="taxId" class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm" />
      </div>

      <p *ngIf="profileError" class="text-sm text-red-600">{{ profileError }}</p>
      <p *ngIf="profileSuccess" class="text-sm text-green-600">Perfil atualizado com sucesso.</p>

      <button
        type="submit"
        [disabled]="profileLoading"
        class="bg-brand-600 hover:bg-brand-700 disabled:opacity-60 text-white text-sm font-medium px-5 py-2.5 rounded-md transition-colors"
      >
        {{ profileLoading ? 'A guardar...' : 'Guardar alterações' }}
      </button>
    </form>
  </div>

  <!-- Trocar senha -->
  <div class="bg-white border rounded-lg p-6">
    <h2 class="text-base font-semibold text-gray-800 mb-1">Trocar senha</h2>
    <p class="text-sm text-gray-500 mb-5">Vai terminar a sessão em todos os dispositivos depois de trocar.</p>

    <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Senha atual</label>
        <input type="password" formControlName="currentPassword" class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nova senha</label>
        <input type="password" formControlName="newPassword" class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm" />
        <p *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid" class="text-xs text-red-600 mt-1">
          Mínimo de 8 caracteres.
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar nova senha</label>
        <input type="password" formControlName="confirmPassword" class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm" />
        <p *ngIf="passwordForm.errors?.['passwordsMismatch'] && passwordForm.get('confirmPassword')?.touched" class="text-xs text-red-600 mt-1">
          As senhas não coincidem.
        </p>
      </div>

      <p *ngIf="passwordError" class="text-sm text-red-600">{{ passwordError }}</p>

      <button
        type="submit"
        [disabled]="passwordLoading"
        class="bg-gray-800 hover:bg-gray-900 disabled:opacity-60 text-white text-sm font-medium px-5 py-2.5 rounded-md transition-colors"
      >
        {{ passwordLoading ? 'A trocar...' : 'Trocar senha' }}
      </button>
    </form>
  </div>
</div>
