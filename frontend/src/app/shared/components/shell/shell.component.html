<div class="min-h-screen flex bg-gray-50">
  <!-- Fundo escurecido por trás da gaveta (só abaixo de lg) -->
  <div
    *ngIf="menuOpen"
    class="fixed inset-0 z-30 bg-black/40 lg:hidden"
    (click)="closeMenu()"
    aria-hidden="true"
  ></div>

  <!-- Menu lateral: gaveta deslizante abaixo de lg; fixo ao lado do conteúdo a partir de lg -->
  <aside
    id="app-sidebar"
    class="fixed inset-y-0 left-0 z-40 w-60 shrink-0 bg-brand-800 text-white flex flex-col overflow-y-auto transition-transform duration-200 lg:static lg:z-auto lg:translate-x-0"
    [ngClass]="menuOpen ? 'translate-x-0' : '-translate-x-full'"
  >
    <div class="px-5 py-5 text-lg font-semibold border-b border-brand-700 flex items-center justify-between">
      <span>Plataforma B2B</span>
      <button
        type="button"
        (click)="closeMenu()"
        class="lg:hidden -mr-2 p-2 rounded-md text-brand-100 hover:bg-brand-700"
        aria-label="Fechar menu"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <nav class="flex-1 py-4">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="bg-brand-900"
        (click)="closeMenu()"
        class="block px-5 py-3 text-sm text-brand-50 hover:bg-brand-700 transition-colors"
      >
        {{ item.label }}
      </a>
    </nav>

    <div class="px-5 py-4 border-t border-brand-700">
      <button
        type="button"
        (click)="logout()"
        class="w-full text-left text-sm text-brand-100 hover:text-white transition-colors"
      >
        Terminar sessão
      </button>
    </div>
  </aside>

  <!-- Conteúdo -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 bg-white border-b flex items-center gap-3 px-4 lg:px-6 shrink-0">
      <button
        type="button"
        (click)="toggleMenu()"
        class="lg:hidden -ml-2 p-2 rounded-md text-gray-600 hover:bg-gray-100"
        aria-label="Abrir menu"
        aria-controls="app-sidebar"
        [attr.aria-expanded]="menuOpen"
      >
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <h1 class="flex-1 min-w-0 truncate text-base lg:text-lg font-semibold text-gray-800">{{ title }}</h1>

      <a
        routerLink="profile"
        class="shrink-0 max-w-[9rem] sm:max-w-none truncate text-sm text-gray-500 hover:text-brand-700 transition-colors"
        *ngIf="auth.currentUser as user"
      >
        {{ user.name }} <span class="hidden sm:inline text-gray-400">· {{ user.role }}</span>
      </a>
    </header>

    <main class="flex-1 overflow-y-auto p-4 lg:p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
