<div class="min-h-screen flex bg-gray-50">
  <!-- Sidebar -->
  <aside class="w-60 shrink-0 bg-brand-800 text-white flex flex-col">
    <div class="px-5 py-5 text-lg font-semibold border-b border-brand-700">
      Plataforma B2B
    </div>

    <nav class="flex-1 py-4">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="bg-brand-900"
        class="block px-5 py-3 text-sm text-brand-50 hover:bg-brand-700 transition-colors"
      >
        {{ item.label }}
      </a>
    </nav>

    <div class="px-5 py-4 border-t border-brand-700">
      <button
        type="button"
        (click)="logout()"
        class="w-full text-left text-sm text-brand-100 hover:text-white transition-colors"
      >
        Terminar sessão
      </button>
    </div>
  </aside>

  <!-- Conteúdo -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-16 bg-white border-b flex items-center justify-between px-6 shrink-0">
      <h1 class="text-lg font-semibold text-gray-800">{{ title }}</h1>
      <a
        routerLink="profile"
        class="text-sm text-gray-500 hover:text-brand-700 transition-colors"
        *ngIf="auth.currentUser as user"
      >
        {{ user.name }} <span class="text-gray-400">· {{ user.role }}</span>
      </a>
    </header>

    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
