<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-sm bg-white rounded-lg shadow-sm border p-8">
    <h1 class="text-xl font-semibold text-gray-800 mb-1">Definir nova senha</h1>

    <div *ngIf="!token" class="text-sm text-red-600 mt-4">
      Link inválido ou incompleto. Peça uma nova recuperação de senha.
      <a routerLink="/auth/forgot-password" class="text-brand-600 hover:underline font-medium block mt-2">
        Pedir novo link
      </a>
    </div>

    <div *ngIf="token && !success">
      <p class="text-sm text-gray-500 mb-6">Escolha a sua nova senha.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nova senha</label>
          <input type="password" formControlName="newPassword" class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm" />
          <p *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.invalid" class="text-xs text-red-600 mt-1">
            Mínimo de 8 caracteres.
          </p>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar nova senha</label>
          <input type="password" formControlName="confirmPassword" class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm" />
          <p *ngIf="form.errors?.['passwordsMismatch'] && form.get('confirmPassword')?.touched" class="text-xs text-red-600 mt-1">
            As senhas não coincidem.
          </p>
        </div>

        <p *ngIf="errorMessage" class="text-sm text-red-600">{{ errorMessage }}</p>

        <button
          type="submit"
          [disabled]="loading"
          class="w-full bg-brand-600 hover:bg-brand-700 disabled:opacity-60 text-white text-sm font-medium py-2.5 rounded-md transition-colors"
        >
          {{ loading ? 'A repor...' : 'Repor senha' }}
        </button>
      </form>
    </div>

    <div *ngIf="success" class="text-sm text-green-600 mt-4">
      Senha reposta com sucesso! A redirecionar para o login...
    </div>
  </div>
</div>
