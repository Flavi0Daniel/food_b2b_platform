<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-sm bg-white rounded-lg shadow-sm border p-8">
    <h1 class="text-xl font-semibold text-gray-800 mb-1">Recuperar senha</h1>

    <div *ngIf="!submitted; else sentMessage">
      <p class="text-sm text-gray-500 mb-6">
        Introduza o seu email. Se existir uma conta, enviamos um link para repor a senha.
      </p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input
            type="email"
            formControlName="email"
            class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm"
            placeholder="voce@empresa.ao"
          />
        </div>

        <p *ngIf="errorMessage" class="text-sm text-red-600">{{ errorMessage }}</p>

        <button
          type="submit"
          [disabled]="loading"
          class="w-full bg-brand-600 hover:bg-brand-700 disabled:opacity-60 text-white text-sm font-medium py-2.5 rounded-md transition-colors"
        >
          {{ loading ? 'A enviar...' : 'Enviar link de recuperação' }}
        </button>
      </form>
    </div>

    <ng-template #sentMessage>
      <p class="text-sm text-gray-600">
        Se existir uma conta com esse email, enviámos um link de recuperação. Verifique a sua
        caixa de entrada (e a pasta de spam).
      </p>
    </ng-template>

    <p class="text-sm text-gray-500 mt-6 text-center">
      <a routerLink="/auth/login" class="text-brand-600 hover:underline font-medium">Voltar ao login</a>
    </p>
  </div>
</div>
