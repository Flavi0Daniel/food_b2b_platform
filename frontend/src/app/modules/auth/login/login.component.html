<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-sm bg-white rounded-lg shadow-sm border p-8">
    <h1 class="text-xl font-semibold text-gray-800 mb-1">Entrar</h1>
    <p class="text-sm text-gray-500 mb-6">Plataforma B2B de Intermediação Alimentar</p>

    <p *ngIf="passwordChanged" class="text-sm text-green-600 bg-green-50 border border-green-200 rounded-md px-3 py-2 mb-4">
      Senha alterada com sucesso. Inicie sessão com a nova senha.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input
          type="email"
          formControlName="email"
          class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm"
          placeholder="voce@empresa.ao"
        />
        <p *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="text-xs text-red-600 mt-1">
          Introduza um email válido.
        </p>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="block text-sm font-medium text-gray-700">Senha</label>
          <a routerLink="/auth/forgot-password" class="text-xs text-brand-600 hover:underline">Esqueci-me da senha</a>
        </div>
        <input
          type="password"
          formControlName="password"
          class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm"
          placeholder="••••••••"
        />
      </div>

      <p *ngIf="errorMessage" class="text-sm text-red-600">{{ errorMessage }}</p>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-brand-600 hover:bg-brand-700 disabled:opacity-60 text-white text-sm font-medium py-2.5 rounded-md transition-colors"
      >
        {{ loading ? 'A entrar...' : 'Entrar' }}
      </button>
    </form>

    <a
      routerLink="/auth/register"
      class="block w-full text-center mt-3 border border-brand-600 text-brand-700 hover:bg-brand-50 text-sm font-medium py-2.5 rounded-md transition-colors"
    >
      Criar conta nova
    </a>
  </div>
</div>
