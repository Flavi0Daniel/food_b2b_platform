<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-10">
  <div class="w-full max-w-sm bg-white rounded-lg shadow-sm border p-8">
    <h1 class="text-xl font-semibold text-gray-800 mb-1">Criar conta</h1>
    <p class="text-sm text-gray-500 mb-6">Para restaurantes e compradores a grosso</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
        <input formControlName="name" class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" formControlName="email" class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <input type="password" formControlName="password" class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm" />
        <p *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="text-xs text-red-600 mt-1">
          Mínimo de 8 caracteres.
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Telefone <span class="text-gray-400">(opcional)</span></label>
        <input formControlName="phone" class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Empresa <span class="text-gray-400">(opcional)</span></label>
        <input formControlName="companyName" class="w-full rounded-md border-gray-300 focus:border-brand-500 focus:ring-brand-500 text-sm" />
      </div>

      <p *ngIf="errorMessage" class="text-sm text-red-600">{{ errorMessage }}</p>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-brand-600 hover:bg-brand-700 disabled:opacity-60 text-white text-sm font-medium py-2.5 rounded-md transition-colors"
      >
        {{ loading ? 'A criar...' : 'Criar conta' }}
      </button>
    </form>

    <p class="text-sm text-gray-500 mt-6 text-center">
      Já tem conta?
      <a routerLink="/auth/login" class="text-brand-600 hover:underline font-medium">Entrar</a>
    </p>
  </div>
</div>
