<h2 class="text-base font-semibold text-gray-800 mb-5">Guias de transporte</h2>

<div *ngIf="loading" class="text-sm text-gray-500">A carregar...</div>
<p *ngIf="errorMessage" class="text-sm text-red-600">{{ errorMessage }}</p>

<div *ngIf="!loading && !shipments.length" class="bg-white border rounded-lg p-10 text-center text-sm text-gray-400">
  Ainda não tem guias de transporte atribuídas.
</div>

<div class="space-y-3">
  <a
    *ngFor="let s of shipments"
    [routerLink]="['/carrier/shipments', s.id]"
    class="block bg-white border rounded-lg p-5 hover:border-brand-300 transition-colors"
  >
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-sm font-medium text-gray-800">
          Guia #{{ s.id }}<span *ngIf="s.poNumber" class="text-gray-400 font-normal"> · {{ s.poNumber }}</span>
        </p>
        <p class="text-sm text-gray-600 mt-1">{{ s.pickup.city }} → {{ s.dropoff.city }}</p>
        <p class="text-xs text-gray-400 mt-1" *ngIf="s.deliveryDate">
          Entrega: {{ s.deliveryDate }}<span *ngIf="s.deliveryWindow"> · {{ s.deliveryWindow }}</span>
        </p>
      </div>
      <div class="text-right shrink-0 space-y-2">
        <app-status-badge [label]="statusLabel(s.shipmentStatus)" [variant]="statusVariant(s.shipmentStatus)"></app-status-badge>
        <p *ngIf="s.shipmentStatus === 'TO_PICKUP' && s.readyForPickup" class="text-xs text-green-700">Pronta para recolha</p>
      </div>
    </div>
  </a>
</div>
